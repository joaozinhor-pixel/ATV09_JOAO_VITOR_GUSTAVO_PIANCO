<section class="conteudo">
        <div class="formulario-container">

            <h2> Contato / Ouvidoria</h2>
            <form id="formContato" method="GET" action="#">

                <!-- Agrupamento 1: Dados Pessoais -->
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <!-- Nome Completo -->
                    <div class="grupo-campo">
                        <label for="nome" class="campo-obrigatorio">Nome Completo</label>
                        <input 
                            type="text" 
                            id="nome" 
                            name="nome" 
                            placeholder="Digite seu nome completo"
                            required
                            minlength="3"
                            maxlength="100"
                        >
                        <div class="dica-campo">Mínimo 3 caracteres</div>
                    </div>

                    <!-- E-mail -->
                    <div class="grupo-campo">
                        <label for="email" class="campo-obrigatorio">E-mail</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="exemplo@email.com"
                            required
                        >
                        <div class="dica-campo">Digite um e-mail válido</div>
                    </div>

                    <!-- Telefone -->
                    <div class="grupo-campo">
                        <label for="telefone" class="campo-obrigatorio">Telefone</label>
                        <input 
                            type="tel" 
                            id="telefone" 
                            name="telefone" 
                            placeholder="(00) 00000-0000"
                            required
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        >
                        <div class="dica-campo">Formato: (99) 99999-9999</div>
                    </div>
                </fieldset>

                <!-- Agrupamento 2: Detalhes da Mensagem -->
                <fieldset>
                    <legend>Detalhes da Mensagem</legend>

                    <!-- Assunto (Select) -->
                    <div class="grupo-campo">
                        <label for="assunto" class="campo-obrigatorio">Assunto</label>
                        <select id="assunto" name="assunto" required>
                            <option value="">Selecione um assunto...</option>
                            <option value="duvida">Dúvida</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="critica">Crítica</option>
                            <option value="elogio">Elogio</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <!-- Perfil do Usuário (Radio) -->
                    <div class="grupo-campo">
                        <label class="campo-obrigatorio">Perfil do Usuário</label>
                        <div class="grupo-radio">
                            <label>
                                <input type="radio" name="perfil" value="aluno" required>
                                Aluno
                            </label>
                            <label>
                                <input type="radio" name="perfil" value="professor">
                                Professor
                            </label>
                            <label>
                                <input type="radio" name="perfil" value="comunidade">
                                Comunidade Externa
                            </label>
                        </div>
                    </div>

                    <!-- Mensagem (Textarea) -->
                    <div class="grupo-campo">
                        <label for="mensagem" class="campo-obrigatorio">Mensagem</label>
                        <textarea 
                            id="mensagem" 
                            name="mensagem" 
                            rows="5" 
                            placeholder="Digite sua mensagem aqui..."
                            required
                            minlength="15"
                            maxlength="500"
                        ></textarea>
                        <div class="dica-campo">Mínimo 15 caracteres</div>
                    </div>
                </fieldset>

                <!-- Botão de Envio -->
                <button type="submit" class="btn-enviar">
                     Enviar Mensagem
                </button>

            </form>
        </div>

    <!-- Mensagem exibida após o envio (controlada pelo script.js) -->
    <section id="pagina-sucesso" class="pagina-sucesso">
            <div class="icone-sucesso">✅</div>
            <h1>Mensagem Enviada com Sucesso!</h1>

            <div id="dadosSucesso" class="mensagem-sucesso">
                <p>Carregando dados...</p>
            </div>

            <button class="btn-voltar" id="btnVoltar" type="button">
                ↩ Voltar para o Formulário
            </button>
    </section>
</section>
